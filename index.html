<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

        <!-- 카메라 화면 -->
        <section id="cameraPage">

            <h1>중요한 단어 뽑기</h1>

            <div class="camera-box">
                <video id="webcam" autoplay playsinline></video>
            </div>

            <p id="cameraMessage"></p>

            <button id="captureBtn" class="main-btn">
                화면 캡처
            </button>

        </section>


        <!-- 결과 화면 -->
        <section id="resultPage" class="hidden">

            <h1>캡처 결과</h1>

            <div class="result-box">

                <canvas id="captureCanvas"></canvas>

                <div id="textResult" class="result-content">
                    <h2>텍스트 결과</h2>
                    <p>텍스트 결과가 여기에 표시됩니다.</p>
                </div>

                <div id="imageResult" class="result-content">
                    <h2>이미지 결과</h2>
                    <p>이미지 결과가 여기에 표시됩니다.</p>
                </div>

            </div>

            <button id="resetBtn" class="main-btn">
                다시 촬영
            </button>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
